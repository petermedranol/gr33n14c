# Configuración de Alembic para Greeniac
# La URL de la base de datos se inyecta en env.py desde settings; dejar en blanco aquí.

[alembic]
# Ruta al directorio que contiene env.py y las versiones
script_location = alembic

# Formato del nombre de los archivos de migración
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Codificación de los archivos generados
output_encoding = utf-8

# Dejar vacío: la URL se configura programáticamente en env.py
sqlalchemy.url =

[post_write_hooks]
# Sin hooks de post-escritura configurados

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
